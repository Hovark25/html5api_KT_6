<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Сетевые запросы и события</title>
  <style>
    body{font-family:system-ui,Segoe UI,Arial;max-width:1000px;margin:18px auto;padding:0 12px;background:#f6f6f7}
    h3{margin:0 0 10px}
    .box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
    input,select,button{padding:8px 10px}
    pre{background:#f6f6f6;padding:10px;border-radius:8px;overflow:auto;min-height:120px}
    .muted{color:#666;font-size:12px}
    .log{height:180px;overflow:auto;background:#111;color:#eee;padding:10px;border-radius:8px;font:12px/1.35 ui-monospace,Consolas}
    .tag{display:inline-block;padding:2px 8px;border:1px solid #ddd;border-radius:999px;font-size:12px;background:#fafafa}
    .pill{display:inline-block;padding:2px 8px;border:1px solid #ddd;border-radius:999px;font-size:12px}
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <h3>Сетевые запросы и события</h3>

  <div class="box">
    <div class="row">
      <span class="tag">Fake API</span>
      <span class="muted">Тип данных</span>
      <select id="apiSel">
        <option value="users">users</option>
        <option value="posts">posts</option>
        <option value="comments">comments</option>
        <option value="albums">albums</option>
        <option value="todos">todos</option>
      </select>

      <span class="muted">Количество</span>
      <input id="limit" type="number" min="1" max="20" value="5" style="width:90px" />

      <button onclick="loadFake()">Загрузка</button>
      <span class="pill" id="fetchStatus">Состояние</span>
    </div>

    <pre id="out">Данные отсутствуют</pre>
    <div class="muted">Fetch API, формат JSON</div>
  </div>

  <div class="box">
    <div class="row">
      <span class="tag">WebSocket</span>

      <span class="muted">Режим</span>
      <select id="wsMode">
        <option value="local">Локальный сервер Socket.IO http://localhost:3001</option>
        <option value="public">Публичный echo wss://echo.websocket.events</option>
      </select>

      <span class="muted">Имя</span>
      <input id="name" placeholder="Имя" style="width:140px" />

      <button onclick="wsConnect()">Подключение</button>
      <button onclick="wsDisconnect()">Отключение</button>

      <span class="pill" id="wsStatus">Отключено</span>
    </div>

    <div class="row">
      <input id="msg" placeholder="Сообщение" style="flex:1;min-width:220px" />
      <button onclick="wsSend()">Отправка</button>
    </div>

    <div class="log" id="wsLog"></div>
    <div class="muted">Режим local требует запущенный server.js, режим public доступен без сервера</div>
  </div>

  <div class="box">
    <div class="row">
      <span class="tag">SSE</span>

      <span class="muted">Режим</span>
      <select id="sseMode">
        <option value="local">Локальный SSE http://localhost:3001/events</option>
        <option value="public">Публичный SSE Wikimedia recentchange</option>
      </select>

      <button onclick="sseStart()">Старт</button>
      <button onclick="sseStop()">Стоп</button>

      <span class="pill" id="sseStatus">Остановлено</span>
    </div>

    <div class="log" id="sseLog"></div>
    <div class="muted">Server Sent Events, потоковые обновления</div>
  </div>

<script>
  const out = document.getElementById("out")
  const fetchStatus = document.getElementById("fetchStatus")

  async function loadFake(){
    const type = document.getElementById("apiSel").value
    const limit = Math.max(1, Math.min(20, Number(document.getElementById("limit").value || 5)))
    const url = `https://jsonplaceholder.typicode.com/${type}?_limit=${limit}`

    fetchStatus.textContent = "Загрузка"
    out.textContent = ""

    try{
      const res = await fetch(url)
      if(!res.ok) throw new Error("HTTP " + res.status)
      const data = await res.json()
      out.textContent = JSON.stringify(data, null, 2)
      fetchStatus.textContent = "Успешно"
    }catch(e){
      fetchStatus.textContent = "Ошибка запроса"
      out.textContent = "Ошибка " + e.message
    }
  }

  let sio = null
  let ws = null

  const wsStatus = document.getElementById("wsStatus")
  const wsLog = document.getElementById("wsLog")

  function wlog(t){
    const div = document.createElement("div")
    div.textContent = t
    wsLog.appendChild(div)
    wsLog.scrollTop = wsLog.scrollHeight
  }

  function wsConnect(){
    wsDisconnect()
    const mode = document.getElementById("wsMode").value
    const name = document.getElementById("name").value.trim() || "anon"

    if(mode === "local"){
      try{
        sio = io("http://localhost:3001", { transports: ["websocket"] })
        sio.on("connect", () => {
          wsStatus.textContent = "Подключено"
          sio.emit("join", name)
          wlog("[sys] connected")
        })
        sio.on("chat", (p) => wlog(`[${p.time}] ${p.name}: ${p.msg}`))
        sio.on("sys", (m) => wlog("[sys] " + m))
        sio.on("connect_error", (e) => {
          wsStatus.textContent = "Ошибка подключения"
          wlog("[err] " + e.message)
        })
      }catch(e){
        wsStatus.textContent = "Ошибка подключения"
        wlog("[err] " + e.message)
      }
      return
    }

    ws = new WebSocket("wss://echo.websocket.events")
    ws.onopen = () => { wsStatus.textContent = "Подключено"; wlog("[sys] connected"); wlog("[sys] mode=public"); wlog("[sys] name=" + name) }
    ws.onmessage = (ev) => wlog(ev.data)
    ws.onerror = () => { wsStatus.textContent = "Ошибка подключения"; wlog("[err] websocket error") }
    ws.onclose = () => { wsStatus.textContent = "Отключено"; wlog("[sys] closed") }
  }

  function wsSend(){
    const text = document.getElementById("msg").value
    if(!text) return
    document.getElementById("msg").value = ""

    if(sio && sio.connected){
      sio.emit("chat", text)
      return
    }
    if(ws && ws.readyState === 1){
      ws.send(text)
      wlog("[me] " + text)
      return
    }
    wlog("[err] not connected")
  }

  function wsDisconnect(){
    if(sio){
      try{ sio.disconnect() }catch{}
      sio = null
    }
    if(ws){
      try{ ws.close() }catch{}
      ws = null
    }
    wsStatus.textContent = "Отключено"
  }

  let es = null
  const sseStatus = document.getElementById("sseStatus")
  const sseLog = document.getElementById("sseLog")

  function slog(t){
    const div = document.createElement("div")
    div.textContent = t
    sseLog.appendChild(div)
    sseLog.scrollTop = sseLog.scrollHeight
  }

  function sseStart(){
    sseStop()
    const mode = document.getElementById("sseMode").value

    const url = mode === "local"
      ? "http://localhost:3001/events"
      : "https://stream.wikimedia.org/v2/stream/recentchange"

    try{
      es = new EventSource(url)
      sseStatus.textContent = "Подключено"

      es.onmessage = (ev) => {
        if(mode === "local"){
          try{
            const obj = JSON.parse(ev.data)
            slog(`[local] ${obj.time} | ${obj.title} | ${obj.text}`)
          }catch{
            slog("[local] " + ev.data)
          }
          return
        }

        try{
          const obj = JSON.parse(ev.data)
          const title = obj.title || obj.meta?.domain || "event"
          slog(`[public] ${title}`)
        }catch{
          slog("[public] event")
        }
      }

      es.onerror = () => {
        sseStatus.textContent = "Ошибка или переподключение"
      }
    }catch(e){
      sseStatus.textContent = "Ошибка"
      slog("[err] " + e.message)
    }
  }

  function sseStop(){
    if(es){
      try{ es.close() }catch{}
      es = null
    }
    sseStatus.textContent = "Остановлено"
  }

  fetchStatus.textContent = "Состояние"
  wsStatus.textContent = "Отключено"
  sseStatus.textContent = "Остановлено"
</script>
</body>
</html>
